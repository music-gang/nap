name: Bug report
description: Something does not behave as documented
type: Bug
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The job HCL (redact secrets), the `nap_*` meta keys involved, the proxy configuration, and the steps.
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: nap version or commit, Nomad version, proxy and its version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (redact secrets). Include the `target` (namespace/job/group).
      render: text
    validations:
      required: false
